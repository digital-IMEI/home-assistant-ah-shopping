name: Publish integration release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: ah-shopping-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Read integration version
        id: version
        shell: bash
        run: |
          version=$(jq -r '.version' custom_components/ah_shopping/manifest.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Publish release when missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          notes_file="docs/releases/$VERSION.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$VERSION" --target "$VALIDATED_SHA" --title "$VERSION" --notes-file "$notes_file"
          else
            gh release create "$VERSION" --target "$VALIDATED_SHA" --title "$VERSION" --generate-notes
          fi
