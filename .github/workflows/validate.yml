name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - custom_components/ah_shopping/**
      - tests/**
      - .github/workflows/validate.yml
      - .github/workflows/release.yml
      - README.md
      - CHANGELOG.md
      - docs/**
      - package*.json
  pull_request:
    paths:
      - custom_components/ah_shopping/**
      - tests/**
      - .github/workflows/validate.yml
      - .github/workflows/release.yml
      - README.md
      - CHANGELOG.md
      - docs/**
      - package*.json

permissions:
  contents: read

concurrency:
  group: ah-shopping-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m compileall -q custom_components/ah_shopping
      - run: pip install pytest aiohttp
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript syntax
        run: |
          cp custom_components/ah_shopping/frontend/ah-shopping-card.js /tmp/ah-shopping-card.mjs
          cp custom_components/ah_shopping/frontend/ean-decoder.js /tmp/ean-decoder.mjs
          node --check /tmp/ah-shopping-card.mjs
          node --check /tmp/ean-decoder.mjs

  frontend-scroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/frontend-scroll.cjs
      - run: node tests/frontend-decoder.cjs
      - run: node tests/frontend-feedback.cjs
      - run: node tests/frontend-freshness.cjs

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # These two checks validate GitHub "About" metadata, not integration files.
          # The repository is used as a custom HACS repository; code/manifest checks remain enabled.
          ignore: description topics
